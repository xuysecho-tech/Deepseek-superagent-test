<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日待办 · Todo</title>
  <meta name="description" content="一个简洁的待办清单，支持添加、编辑、搜索、完成、拖动排序与本地保存。">
  <meta name="theme-color" content="#f3f4fa" id="theme-color">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235546e8'/%3E%3Cpath d='M18 33l9 9 19-21' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("simple-todo:theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="app__heading">
        <p class="eyebrow">My Tasks</p>
        <h1>今日待办</h1>
        <p class="date" id="today"></p>
      </div>
      <div class="app__aside">
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="切换到深色模式" title="切换深色 / 浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path>
          </svg>
        </button>
        <div class="progress" id="progress" role="img" aria-label="完成进度 0%">
          <div class="progress__ring" id="progress-ring">
            <span class="progress__value" id="progress-value">0%</span>
          </div>
        </div>
      </div>
    </header>

    <form class="composer" id="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待办内容</label>
      <input id="todo-input" name="title" type="text" maxlength="200" placeholder="写下一件要做的事…" enterkeyhint="done" required>
      <button class="btn-primary" type="submit">添加</button>
    </form>

    <section class="workspace" aria-label="待办清单">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="筛选待办">
          <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">
            全部 <span class="filter__count" data-count="all">0</span>
          </button>
          <button type="button" class="filter" data-filter="active" aria-pressed="false">
            待完成 <span class="filter__count" data-count="active">0</span>
          </button>
          <button type="button" class="filter" data-filter="completed" aria-pressed="false">
            已完成 <span class="filter__count" data-count="completed">0</span>
          </button>
        </div>
        <div class="toolbar__actions">
          <button type="button" class="icon-btn" id="search-toggle" aria-label="搜索待办" aria-expanded="false" title="搜索待办（/）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.2-3.2"></path>
            </svg>
          </button>
          <button type="button" class="clear-btn" id="clear-completed" disabled>清除已完成</button>
        </div>
      </div>

      <div class="search" id="search-bar" hidden>
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.2-3.2"></path>
        </svg>
        <label class="sr-only" for="search-input">搜索待办</label>
        <input id="search-input" type="search" placeholder="搜索待办标题…" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search__clear" id="search-clear" aria-label="清除搜索" title="清除搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <div class="empty" id="empty-state">
        <div class="empty__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"></path>
            <path d="M9 3.5h6V6H9z"></path>
            <path d="m8.5 13 2.2 2.2 4.3-4.4"></path>
          </svg>
        </div>
        <p class="empty__title" id="empty-title">还没有待办</p>
        <p class="empty__text" id="empty-text">添加第一件，让今天井井有条。</p>
      </div>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>

      <footer class="app__footer">
        <span id="summary">还没有待办</span>
        <span class="app__hint">Enter 添加 · 双击编辑 · 拖动排序 · 数据保存在本地</span>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__text" id="toast-text"></span>
    <button type="button" class="toast__undo" id="toast-undo">撤销</button>
  </div>

  <noscript>请启用 JavaScript 以使用待办清单。</noscript>
  <script src="app.js"></script>
</body>
</html>
