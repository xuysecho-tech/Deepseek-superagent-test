<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今天 · 今日待办</title>
  <meta name="description" content="一个完整的待办系统：今天、明天、未来七天、全部待办与已完成视图，支持日期、优先级、搜索与本地保存。">
  <meta name="theme-color" content="#f3f4fa" id="theme-color">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235546e8'/%3E%3Cpath d='M18 33l9 9 19-21' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("simple-todo:theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="account">
        <span class="account__avatar" aria-hidden="true">我</span>
        <div class="account__info">
          <span class="account__name">我的待办</span>
          <span class="account__meta">本地账户 · 数据保存在本机</span>
        </div>
      </div>

      <nav class="nav" aria-label="任务视图">
        <p class="nav__label">视图</p>
        <button type="button" class="nav__item is-active" data-view="today" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M8 3v4M16 3v4M3 10h18"></path>
            <circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"></circle>
          </svg>
          <span>今天</span>
          <span class="nav__count" data-view-count="today">0</span>
        </button>
        <button type="button" class="nav__item" data-view="tomorrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v4M5.6 7.6 7 9M18.4 7.6 17 9M3 13h2M19 13h2"></path>
            <path d="M7 18a5 5 0 0 1 10 0"></path>
            <path d="M3 18h18"></path>
          </svg>
          <span>明天</span>
          <span class="nav__count" data-view-count="tomorrow">0</span>
        </button>
        <button type="button" class="nav__item" data-view="next7">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M8 3v4M16 3v4M3 10h18"></path>
            <path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"></path>
          </svg>
          <span>未来七天</span>
          <span class="nav__count" data-view-count="next7">0</span>
        </button>
        <button type="button" class="nav__item" data-view="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10"></path>
          </svg>
          <span>全部待办</span>
          <span class="nav__count" data-view-count="all">0</span>
        </button>
        <button type="button" class="nav__item" data-view="overdue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v5M12 16.5v.5"></path>
          </svg>
          <span>已逾期</span>
          <span class="nav__count" data-view-count="overdue">0</span>
        </button>
        <button type="button" class="nav__item" data-view="completed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8.5 12 2.4 2.4 4.6-5"></path>
          </svg>
          <span>已完成</span>
          <span class="nav__count" data-view-count="completed">0</span>
        </button>
      </nav>

      <div class="sidebar__footer">
        <div class="today-progress">
          <div class="today-progress__head">
            <span>今日进度</span>
            <span id="today-progress-text">0 / 0</span>
          </div>
          <div class="today-progress__track" id="today-progress-track" role="progressbar" aria-label="今日完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="today-progress__fill" id="today-progress-fill"></span>
          </div>
        </div>
        <button type="button" class="theme-btn" id="theme-toggle" aria-label="切换到深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path>
          </svg>
          <span id="theme-label">深色模式</span>
        </button>
        <p class="sidebar__note">数据保存在浏览器本地</p>
      </div>
    </aside>

    <main class="main">
      <header class="main__header">
        <div class="main__heading">
          <p class="eyebrow" id="view-eyebrow">Today</p>
          <h1 id="view-title">今天</h1>
          <p class="subtitle" id="view-subtitle">11月26日 · 星期四</p>
        </div>
        <div class="main__actions">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.2-3.2"></path>
            </svg>
            <label class="sr-only" for="search-input">搜索当前列表</label>
            <input id="search-input" type="search" placeholder="搜索当前列表…" autocomplete="off" enterkeyhint="search">
            <button type="button" class="search__clear" id="search-clear" aria-label="清除搜索" title="清除搜索" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </div>
          <button type="button" class="add-btn" id="add-task" title="添加任务（N）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>添加</span>
          </button>
        </div>
      </header>

      <div class="main__content" id="main-content">
        <div class="view-toolbar">
          <span class="view-toolbar__count" id="list-count"></span>
          <button type="button" class="link-btn" id="clear-completed" hidden>清除已完成</button>
        </div>

        <ul class="task-list" id="task-list"></ul>

        <div class="empty" id="empty-state" hidden>
          <div class="empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"></path>
              <path d="M9 3.5h6V6H9z"></path>
              <path d="m8.5 13 2.2 2.2 4.3-4.4"></path>
            </svg>
          </div>
          <p class="empty__title" id="empty-title">今天还没有待办</p>
          <p class="empty__text" id="empty-text">点击「添加」安排今天的第一件事。</p>
        </div>

        <section class="completed-section" id="today-completed" hidden aria-labelledby="today-completed-title">
          <div class="section-head">
            <h2 id="today-completed-title">今日已完成</h2>
            <span class="section-count" id="today-completed-count">0</span>
          </div>
          <ul class="task-list task-list--done" id="today-completed-list"></ul>
        </section>

        <p class="sr-only" id="status" role="status" aria-live="polite"></p>

        <footer class="main__footer">
          <span>按 N 添加任务 · 按 / 搜索</span>
          <span>数据保存在本地浏览器</span>
        </footer>
      </div>
    </main>
  </div>

  <dialog class="dialog" id="task-dialog" aria-labelledby="dialog-title">
    <form class="dialog__form" id="task-form" novalidate>
      <header class="dialog__header">
        <h2 id="dialog-title">新建任务</h2>
        <button type="button" class="icon-btn dialog__close" id="dialog-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </header>

      <div class="field">
        <label for="task-title">任务名称</label>
        <input id="task-title" name="title" type="text" maxlength="200" placeholder="要做什么？" autocomplete="off">
        <p class="field__error" id="title-error" role="alert" hidden>请填写任务名称</p>
      </div>

      <div class="field">
        <label for="task-notes">备注 <span class="field__optional">（可选）</span></label>
        <textarea id="task-notes" name="notes" rows="2" maxlength="500" placeholder="补充说明…"></textarea>
      </div>

      <div class="field">
        <label for="task-date">日期</label>
        <div class="date-row">
          <input id="task-date" name="dueDate" type="date">
          <button type="button" class="chip-btn" data-quick-date="today">今天</button>
          <button type="button" class="chip-btn" data-quick-date="tomorrow">明天</button>
          <button type="button" class="chip-btn" data-quick-date="clear">清除</button>
        </div>
      </div>

      <fieldset class="field">
        <legend>优先级</legend>
        <div class="priority-picker">
          <label class="priority-option" data-priority="low">
            <input type="radio" name="priority" value="low">
            <span class="priority__dot"></span>
            低
          </label>
          <label class="priority-option" data-priority="medium">
            <input type="radio" name="priority" value="medium" checked>
            <span class="priority__dot"></span>
            中
          </label>
          <label class="priority-option" data-priority="high">
            <input type="radio" name="priority" value="high">
            <span class="priority__dot"></span>
            高
          </label>
        </div>
      </fieldset>

      <footer class="dialog__footer">
        <button type="button" class="btn-ghost" id="dialog-cancel">取消</button>
        <button type="submit" class="btn-primary dialog__submit" id="dialog-submit">添加任务</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__text" id="toast-text"></span>
    <button type="button" class="toast__undo" id="toast-undo">撤销</button>
  </div>

  <noscript>请启用 JavaScript 以使用待办清单。</noscript>
  <script src="app.js"></script>
</body>
</html>
